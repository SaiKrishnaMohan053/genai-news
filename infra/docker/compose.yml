services:
  postgres:
    image: postgres:18
    container_name: genai-news-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - '${POSTGRES_PORT}:5432'

    volumes:
      - postgres-data:/var/lib/postgresql

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8
    container_name: genai-news-redis
    restart: unless-stopped

    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']

    ports:
      - '${REDIS_PORT}:6379'

    volumes:
      - redis-data:/data

    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  migrate:
    image: genai-news-api:phase0
    container_name: genai-news-migrate
    restart: 'no'

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

    command: ['pnpm', '--filter', '@genai-news/database', 'db:deploy']

    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: genai-news-api:phase0
    container_name: genai-news-api
    restart: unless-stopped

    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3001

      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      GNEWS_API_KEY: ${GNEWS_API_KEY}

      NEWS_FRESHNESS_HOURS: ${NEWS_FRESHNESS_HOURS:-24}
      NEWS_MAX_FUTURE_SKEW_MINUTES: ${NEWS_MAX_FUTURE_SKEW_MINUTES:-5}

      REDIS_URL: redis://redis:6379

      LOG_LEVEL: ${LOG_LEVEL}
      OTEL_ENABLED: ${OTEL_ENABLED}

    ports:
      - '${API_PORT}:3001'

    depends_on:
      migrate:
        condition: service_completed_successfully

      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  worker:
    image: genai-news-worker:phase0
    container_name: genai-news-worker
    restart: unless-stopped

    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:3001

      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      GNEWS_API_KEY: ${GNEWS_API_KEY}

      OPENAI_API_KEY: ${OPENAI_API_KEY}

      STORY_EMBEDDING_MODEL: ${STORY_EMBEDDING_MODEL:-text-embedding-3-small}

      STORY_CANDIDATE_WINDOW_HOURS: ${STORY_CANDIDATE_WINDOW_HOURS:-24}

      STORY_INCLUDE_UNKNOWN_TIME: ${STORY_INCLUDE_UNKNOWN_TIME:-false}

      NEWS_FRESHNESS_HOURS: ${NEWS_FRESHNESS_HOURS:-24}
      NEWS_MAX_FUTURE_SKEW_MINUTES: ${NEWS_MAX_FUTURE_SKEW_MINUTES:-5}

      REDIS_URL: redis://redis:6379

      WORKER_HEALTH_HOST: 0.0.0.0
      WORKER_HEALTH_PORT: 3002

      LOG_LEVEL: ${LOG_LEVEL}
      OTEL_ENABLED: ${OTEL_ENABLED}

    ports:
      - '${WORKER_HEALTH_PORT}:3002'

    depends_on:
      migrate:
        condition: service_completed_successfully

      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3002/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  web:
    image: genai-news-web:phase0
    container_name: genai-news-web
    restart: unless-stopped

    environment:
      NODE_ENV: production

    ports:
      - '${WEB_PORT}:3000'

    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
